<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DPAC Marketing">
<title>DPAC · Marketing Dashboard</title>
<style>
  /* ============ DPAC huisstijl (logo): zwart, zand, groen, blauw, rood, geel ============ */
  :root{
    --ink:#0e0e0f; --ink2:#1c1c1e; --sand:#d8d1b3; --sand2:#efeadb; --sand3:#f7f4ea;
    --green:#1a9a3d; --blue:#1f6fd8; --red:#dc2a1e; --yellow:#f2c400;
    --txt:#0e0e0f; --sel-bg:#0e0e0f; --sel-tx:#ffffff; --sel-tx2:#d8d1b3;
    --bg:#f5f4f0; --card:#ffffff; --mut:#6e6e73; --mut2:#8e8e93; --line:#e6e4dc; --line2:#efede6;
    --plan:var(--blue); --plan-bg:#e9f1fc; --plan-tx:#1758ad;
    --show:var(--yellow); --show-bg:#fdf6d8; --show-tx:#8a6d00;
    --sign:var(--green); --sign-bg:#e5f5ea; --sign-tx:#15803a;
    --close:var(--red); --close-bg:#fde9e7; --close-tx:#b91f15;
    --pay:#8f845e; --pay-bg:var(--sand2); --pay-tx:#5f5638;
    --red-bg:#fde9e7; --radius:16px; --r2:12px;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(20,20,20,.05);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.35;font-feature-settings:"tnum" 1,"cv11" 1}
  a{color:inherit}
  button{font-family:inherit}
  ::-webkit-scrollbar{height:6px;width:6px} ::-webkit-scrollbar-thumb{background:#c9c6bb;border-radius:6px} ::-webkit-scrollbar-track{background:transparent}
  .hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}

  /* ---- topbar (zwart, zand) ---- */
  .top{background:var(--ink);color:var(--sand);padding:calc(14px + env(safe-area-inset-top)) 22px 14px;display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;position:relative}
  .top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--green) 0 25%,var(--blue) 25% 50%,var(--red) 50% 75%,var(--yellow) 75% 100%)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--ink2);border:1.5px solid #2c2c2e;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .logo i{position:absolute;left:5px;right:5px;bottom:6px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--green) 0 25%,var(--blue) 25% 50%,var(--red) 50% 75%,var(--yellow) 75% 100%)}
  .top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px;color:#fff;white-space:nowrap}
  .top .sub{opacity:.75;font-size:12px;margin-top:2px;color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v2tag{font-size:10px;font-weight:800;background:var(--sand);color:var(--ink);border-radius:99px;padding:2px 8px;vertical-align:middle;margin-left:6px;letter-spacing:.5px}
  .spacer{flex:1}
  .rfw{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .rbtn{border:1px solid #3a3a3c;background:var(--ink2);color:var(--sand);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .rbtn:hover{border-color:var(--sand)} .rbtn:disabled{opacity:.55;cursor:wait}
  .rtxt{font-size:11px;color:#a5a08a;max-width:260px;text-align:right}
  /* datumkiezer */
  .dp{position:relative}
  .dp-field{background:var(--ink2);border:1px solid #3a3a3c;color:#fff;border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;user-select:none;white-space:nowrap}
  .dp-field:hover{border-color:var(--sand)}
  .dp-pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.28);padding:14px;z-index:60;display:none}
  .dp-pop.open{display:block}
  .dp-hint{font-size:11.5px;color:var(--mut);margin:0 2px 8px;text-align:center}
  .dp-months{display:flex;gap:18px}
  .dp-m{width:224px}
  .dp-mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .dp-mh b{font-size:13px}
  .dp-nav{border:none;background:var(--bg);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;color:var(--txt)}
  .dp-grid{display:grid;grid-template-columns:repeat(7,30px);gap:2px}
  .dp-dow{font-size:10px;color:var(--mut);text-align:center;padding:3px 0}
  .dp-d{border:none;background:none;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--txt)}
  .dp-d:hover{background:var(--plan-bg)}
  .dp-d.out{color:#c3cad8;cursor:default;background:none}
  .dp-d.inR{background:var(--plan-bg);border-radius:0}
  .dp-d.prev{background:#d5e6fa;border-radius:0}
  .dp-d.cap{background:var(--plan);color:#fff;font-weight:700;border-radius:9px}
  .dp-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;user-select:none;font-weight:600}
  .chip:hover{border-color:var(--plan);color:var(--plan)}

  /* ---- tabs (scrollbaar) + modus ---- */
  .tabsrow{display:flex;align-items:center;gap:10px;padding:12px 22px 0}
  .tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-snap-type:x proximity}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;flex:none;scroll-snap-align:start;color:var(--txt)}
  .tab .dot{width:8px;height:8px;border-radius:50%}
  .tab.on{background:var(--sel-bg);color:var(--sel-tx);border-color:var(--sel-bg)}
  .modesw{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card);font-size:12px;font-weight:700;flex:none;padding:2px}
  .modesw span{padding:6px 12px;cursor:pointer;color:var(--mut);border-radius:99px} .modesw span.on{background:var(--sel-bg);color:var(--sel-tx2)}
  main{padding:16px 22px 48px;max-width:1600px;margin:0 auto}

  /* ---- kpi's ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
  .kpi b{font-size:22px;display:block;letter-spacing:-.4px;line-height:1.15}
  .kpi span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:block;margin-top:2px}
  .kpi .dlt{display:block;font-style:normal;font-size:11px;font-weight:700;margin-top:4px} .kpi .dlt.up{color:var(--sign-tx)} .kpi .dlt.dn{color:var(--close-tx)} .kpi .dlt.eq{color:var(--mut2)}

  /* ---- funnelkolommen ---- */
  .cols{display:flex;gap:10px;align-items:stretch}
  .fcol{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;flex:1 1 0;min-width:0;box-shadow:var(--shadow)}
  .fcol.tot{border:2px solid var(--sel-bg)}
  .fcol.mini{flex:0 0 54px;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 6px;cursor:pointer}
  .fcol.mini:hover{border-color:var(--plan)}
  .fcol.mini .vname{writing-mode:vertical-rl;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.5px}
  .fcol.mini .vnum{font-size:13px;font-weight:800}
  .fhead{display:flex;gap:9px;align-items:center;margin:-4px -6px 2px;padding:4px 6px;border-radius:10px;cursor:pointer}
  .fhead:hover{background:var(--bg)}
  .ava{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
  .fhead b{font-size:15px;letter-spacing:-.2px}
  .bigN{margin-left:auto;background:var(--sel-bg);color:var(--sel-tx2);border-radius:10px;padding:3px 11px;font-size:17px;font-weight:800}
  .grp{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px 2px;display:flex;align-items:center;gap:6px} .grp.first{margin-top:0} .grp i{font-style:normal;font-weight:600;text-transform:none;letter-spacing:0;opacity:.85} .grp:after{content:"";flex:1;height:1px;background:var(--line)}
  .chw{padding:12px 16px 10px;border-bottom:1px solid var(--line)} .chstrip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch} .chc{flex:0 0 auto;min-width:60px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;text-align:center;font-size:10.5px;color:var(--mut)} .chc b{display:block;font-size:13px;color:var(--txt);letter-spacing:-.2px} .chc small{font-size:10px} .chc.cur{border-color:var(--plan)} .chc.weak b{color:var(--mut)}
  .sm.on{border-color:var(--plan);box-shadow:0 0 0 1px var(--plan) inset}
  .cmptbl tr.hdr td{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);padding:12px 10px 4px;background:transparent;border-bottom:1px solid var(--line)}
  .brontbl th.on,.brontbl td.on{background:rgba(31,111,216,.08)} .brontbl td.clk{cursor:pointer} .brontbl td.clk:hover b{text-decoration:underline} .brontbl tr.sel td,.cmp tr.sel td{background:rgba(31,111,216,.12)} .cmp td.clk{cursor:pointer} .cmp td.clk:hover b{text-decoration:underline} .dim{color:var(--mut2)}
  .shr{display:flex;align-items:center;gap:6px} .shr em{width:70px;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;display:block;flex:0 0 auto} .shr em i{display:block;height:100%;background:var(--plan)} .shr span{font-size:11.5px;color:var(--mut)}
  .fst{display:grid;grid-template-columns:130px 1fr 48px minmax(0,1.2fr);gap:10px;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line2)} .fst em{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;display:block} .fst em i{display:block;height:100%} .fst b{font-size:14px} .fst small{color:var(--mut)}
  .dayhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px} .dayhd b{font-size:14px} .dayhd span{font-size:12px;color:var(--mut)} .daycard.today{border-color:var(--plan)} .warnt{color:var(--close-tx)} .stg.warn{background:rgba(201,154,0,.15);color:var(--show-tx)} .kpi.warnk b{color:var(--close-tx)} .kpis.ikp{margin-bottom:12px}
  .fsub{font-size:11.5px;color:var(--mut);margin:0 0 12px 39px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
  .blk{flex:1;min-width:0;border-radius:var(--r2);padding:8px 12px 10px;cursor:pointer;position:relative;overflow:hidden;border:2px solid transparent}
  .blk:hover{filter:brightness(.98)}
  .blk.sel{border-color:var(--sel-bg)}
  .blk .lab{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
  .blk .lab .rol{font-style:normal;font-weight:600;opacity:.7;text-transform:none;letter-spacing:0;font-size:10px;margin-left:4px}
  .blk .lab .uit{text-transform:none;letter-spacing:0;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .blk .pct{font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.4px}
  .blk .bar{position:absolute;left:0;bottom:0;height:4px;border-radius:0 3px 3px 0}
  .outN{width:clamp(40px,3.2vw,54px);flex:none;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;cursor:pointer;border:2px solid transparent}
  .outN.sel{border-color:var(--sel-bg)}
  .blk.p,.outN.p{background:var(--plan-bg)} .blk.p .pct,.outN.p{color:var(--plan-tx)} .blk.p .bar{background:var(--plan)} .blk.p .lab{color:var(--plan-tx)}
  .blk.h,.outN.h{background:var(--show-bg)} .blk.h .pct,.outN.h{color:var(--show-tx)} .blk.h .bar{background:var(--show)} .blk.h .lab{color:var(--show-tx)}
  .blk.s,.outN.s{background:var(--sign-bg)} .blk.s .pct,.outN.s{color:var(--sign-tx)} .blk.s .bar{background:var(--sign)} .blk.s .lab{color:var(--sign-tx)}
  .blk.i,.outN.i{background:#e6f3f4} .blk.i .pct,.outN.i{color:#0e7a86} .blk.i .bar{background:#0e9aa7} .blk.i .lab{color:#0e7a86}
  html[data-theme="dark"] .blk.i,html[data-theme="dark"] .outN.i{background:#0f2b2e} html[data-theme="dark"] .blk.i .pct,html[data-theme="dark"] .outN.i,html[data-theme="dark"] .blk.i .lab{color:#5fd0da}
  .blk.c,.outN.c{background:var(--close-bg)} .blk.c .pct,.outN.c{color:var(--close-tx)} .blk.c .bar{background:var(--close)} .blk.c .lab{color:var(--close-tx)}
  .blk.b,.outN.b{background:var(--pay-bg)} .blk.b .pct,.outN.b{color:var(--pay-tx)} .blk.b .bar{background:var(--pay)} .blk.b .lab{color:var(--pay-tx)}

  /* ---- chips, tabellen, kaarten ---- */
  .wonchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .wchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
  .wchip .n{background:var(--sign-bg);color:var(--sign-tx);border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:700}
  .wchip.on{background:var(--sel-bg);color:var(--sel-tx);border-color:var(--sel-bg)}
  .wchip.on .n{background:rgba(255,255,255,.2);color:#fff}
  .wontbl,.cmp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
  .cmp{margin-bottom:12px}
  .cmp h3{margin:0 0 10px;font-size:13.5px;letter-spacing:-.1px}
  .cmp table{font-size:12.5px} .cmp th{cursor:default} .cmp td{max-width:none}
  .cmp .best{color:var(--sign-tx);font-weight:800} .cmp .worst{color:var(--close-tx);font-weight:800}
  .cmp th i{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:var(--mut2)}
  .cmp tr.cur td{background:var(--bg)} .cmp tr.tot td{border-top:2px solid var(--line);font-weight:600}
  table.trend td small{display:block;font-size:10px;color:var(--mut);font-weight:400}
  .tbar{position:relative;height:16px;min-width:64px;background:var(--bg);border-radius:4px;overflow:hidden} .tbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;opacity:.9} .tbar span{position:relative;font-size:11px;font-weight:700;padding-left:5px;line-height:16px}
  .wontot{margin-top:10px;font-size:13px;font-weight:700;color:var(--sign-tx)}
  .advgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .advcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .advcard .rank{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--sel-bg);color:var(--sel-tx2);font-weight:800;font-size:13px;margin-right:9px;flex:none}
  .advcard h3{display:flex;align-items:center;margin:0 0 8px;font-size:14.5px;letter-spacing:-.1px}
  .advcard p{margin:0 0 8px;font-size:13px;line-height:1.55;color:var(--txt);opacity:.85}
  .advcard .doen{font-size:12.5px;font-weight:700;color:var(--plan-tx)}
  .advcard .imp{float:right;font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;margin-left:8px}
  .imp.hi{background:var(--close-bg);color:var(--close-tx)} .imp.mid{background:var(--show-bg);color:var(--show-tx)} .imp.lo{background:var(--plan-bg);color:var(--plan-tx)}

  /* ---- detail ---- */
  .detail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:16px;overflow:hidden;box-shadow:var(--shadow)}
  .dhead{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .dhead b{font-size:15px;letter-spacing:-.2px}
  .dhead span{color:var(--mut);font-size:12.5px}
  .dcols{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .dcol{padding:12px 16px 16px;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .dcol + .dcol{border-left:1px solid var(--line)}
  .dcol h3{font-size:12.5px;margin:2px 0 10px;display:flex;gap:8px;align-items:center}
  .pill{border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700}
  .pill.ok{background:var(--sign-bg);color:var(--sign-tx)} .pill.bad{background:var(--close-bg);color:var(--close-tx)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--mut);font-weight:600;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:4px 8px 6px;border-bottom:1px solid var(--line);user-select:none;white-space:nowrap}
  th .sortl{cursor:pointer} th .sortl:hover{color:var(--plan)}
  th .arr{font-size:9px}
  .fbtn{cursor:pointer;color:var(--mut);margin-left:6px;font-size:13px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:inline-block;line-height:1.2}
  .fbtn:hover{color:var(--plan);background:var(--plan-bg);border-color:var(--plan)}
  .fbtn.on{color:#fff;background:var(--plan);border-color:var(--plan)}
  .fsum{border-top:2px solid var(--line);margin-top:4px;padding:8px 9px;font-size:12.5px;font-weight:800;color:var(--plan-tx);position:sticky;bottom:0;background:var(--card)}
  .fdrop{position:fixed;z-index:99;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:6px;min-width:190px;max-width:calc(100vw - 20px);max-height:290px;overflow-y:auto}
  .fdrop .fi{display:flex;justify-content:space-between;gap:12px;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
  .fdrop .fi:hover{background:var(--bg)}
  .fdrop .fi.on{background:var(--plan-bg);color:var(--plan-tx);font-weight:700}
  .fdrop .fi b{color:var(--mut);font-weight:600} .fdrop .fi.on b{color:var(--plan-tx)}
  .fdrop .fall{border-bottom:1px solid var(--line);margin-bottom:4px;font-weight:700}
  td{padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  td a{color:var(--plan-tx);text-decoration:none;font-weight:600}
  td a:hover{text-decoration:underline}
  .stg{display:inline-block;background:var(--bg);border-radius:6px;padding:1.5px 7px;font-size:11px}
  .stg.win{background:var(--sign-bg);color:var(--sign-tx)} .stg.lost{background:var(--close-bg);color:var(--close-tx)}
  .more{color:var(--mut);font-size:12px;padding:8px;text-align:center;cursor:pointer}
  .note{color:var(--mut);font-size:11.5px;margin-top:14px;line-height:1.55}
  .empty{color:var(--mut);padding:14px 8px;font-size:12.5px}
  code{background:var(--sand2);border-radius:4px;padding:0 4px;font-size:11px}

  /* ---- toegangscode ---- */
  #gate{position:fixed;inset:0;background:var(--ink);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
  #gate:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--green) 0 25%,var(--blue) 25% 50%,var(--red) 50% 75%,var(--yellow) 75% 100%)}
