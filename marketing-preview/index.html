<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPAC · Marketing (mock-up)</title>
</head>
<body>
<script>
// Mock-up: laadt de live pagina (opmaak + app.js) en legt er preview.js overheen. Geen kopie van de code.
(async()=>{
  const t=await (await fetch((location.pathname.indexOf("/marketing-preview/")>=0?"../marketing-v3.2/":"../")+"index.html",{cache:"no-store"})).text();
  const doc=new DOMParser().parseFromString(t,"text/html");
  doc.querySelectorAll("script").forEach(s=>s.remove());
  document.head.append(...doc.head.querySelectorAll("link,style"));
  document.body.className=doc.body.className; document.body.innerHTML=doc.body.innerHTML;
  const load=src=>new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=err; document.body.appendChild(s); });
  const base=location.pathname.indexOf("/marketing-preview/")>=0?"../marketing-v3.2/":"../"; await load(base+"app.js?v=35"); await load("preview.js?v=4");
})();
</script>
</body>
</html>
